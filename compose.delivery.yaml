# Automatic mail overlay. Caddy provisions the certificate used by SMTP STARTTLS.
x-smtp-certificate-dir: &smtp-certificate-dir caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.bond-sdc.com

services:
  service-desk-central:
    environment:
      DIGEST_MAIL_CONFIG: mail-delivery.caddy
      SMTP_CERTIFICATE_DIR: *smtp-certificate-dir
    volumes:
      - ./deploy/mail-delivery.caddy:/etc/caddy/mail-delivery.caddy:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s "/data/$$SMTP_CERTIFICATE_DIR/mail.bond-sdc.com.crt" &&
          test -s "/data/$$SMTP_CERTIFICATE_DIR/mail.bond-sdc.com.key"
      interval: 10s
      timeout: 3s
      start_period: 1m
      retries: 24

  digest-bot:
    # The listener reads its certificate at startup. Wait for both Caddy files.
    depends_on:
      service-desk-central:
        condition: service_healthy
    stop_grace_period: 65s
    environment:
      DIGEST_EMAIL_DELIVERY_ENABLED: "true"
      AWS_REGION: ap-southeast-2
      DIGEST_GROUP_ADDRESS: ${DIGEST_GROUP_ADDRESS:?Set DIGEST_GROUP_ADDRESS to the Microsoft 365 group email}
      DIGEST_DATABASE: /data/digest.sqlite
      DIGEST_TLS_CERT_FILE: /run/digest-tls/mail.bond-sdc.com.crt
      DIGEST_TLS_KEY_FILE: /run/digest-tls/mail.bond-sdc.com.key
    ports:
      # Microsoft 365 and other sending servers connect to the EC2 SMTP port.
      - "25:2525"
    volumes:
      # Keep the queue and Email History on the EC2 host across container replacements.
      - type: bind
        source: ./var/data
        target: /data
        bind:
          create_host_path: false
      - type: volume
        source: caddy-data
        target: /run/digest-tls
        read_only: true
        volume:
          nocopy: true
          subpath: *smtp-certificate-dir
