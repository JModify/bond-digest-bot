services:
  digest-bot:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 65s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: .env
    environment:
      DIGEST_DATABASE: /data/digest.sqlite
      DIGEST_TLS_DIR: /run/digest-tls
    ports:
      - "127.0.0.1:8080:8080"
      - "0.0.0.0:25:2525"
    volumes:
      - ./var/data:/data
      - ./var/smtp-tls:/run/digest-tls:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
