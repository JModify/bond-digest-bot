name: bond-sdc

services:
  service-desk-central:
    build: ../bond-service-desk-central
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      DIGEST_AUTH_USER: ${DIGEST_AUTH_USER:-josh}
      DIGEST_AUTH_HASH: ${DIGEST_AUTH_HASH:?Set DIGEST_AUTH_HASH in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: local

  digest-bot:
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local

volumes:
  caddy-data:
  caddy-config:
