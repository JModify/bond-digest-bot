name: bond-sdc

services:
  service-desk-central:
    build: ../bond-service-desk-central
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: local

  digest-bot:
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SDC_ADMIN_ENABLED: ${SDC_ADMIN_ENABLED:-false}
      SDC_ADMIN_DATABASE: /admin-data/admin.sqlite
      SDC_ADMIN_EC2_INSTANCE_ID: ${SDC_ADMIN_EC2_INSTANCE_ID:-}
    volumes:
      - sdc-admin-data:/admin-data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local

volumes:
  caddy-data:
  caddy-config:
  sdc-admin-data:
