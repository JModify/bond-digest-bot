server {
    listen 80;
    server_name bond-sdc.com www.bond-sdc.com digest.bond-sdc.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name mail.bond-sdc.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name www.bond-sdc.com;
    ssl_certificate /etc/letsencrypt/live/bond-sdc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bond-sdc.com/privkey.pem;

    return 301 https://bond-sdc.com$request_uri;
}

server {
    listen 443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name bond-sdc.com;
    ssl_certificate /etc/letsencrypt/live/bond-sdc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bond-sdc.com/privkey.pem;

    root /var/www/service-desk-central;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name digest.bond-sdc.com;
    ssl_certificate /etc/letsencrypt/live/bond-sdc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bond-sdc.com/privkey.pem;

    auth_basic "Digest Bot";
    auth_basic_user_file /etc/nginx/digest-users;
    client_max_body_size 16k;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
    }
}
